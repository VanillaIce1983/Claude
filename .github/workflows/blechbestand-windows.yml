# Blechbestand (Windows-Programm, .NET Framework 4.8) bauen, Datenlogik testen, die Exe auf Windows einmal starten
# und mit einem Screenshot als Artefakt bereitstellen.
# Tags blechbestand-v* (z. B. blechbestand-v1.0.0, passend zur <Version> in src/Blechbestand.csproj) werden zusätzlich
# als GitHub-Release veröffentlicht: Blechbestand-<Version>.zip (Exe, LIESMICH.txt, Logo) und SHA256.txt, Text aus RELEASE.md.
# Ohne eigenen Tag: manuell starten mit „Als Release veröffentlichen“; dann legt der Lauf Tag und Release an.
name: blechbestand-windows

on:
  push:
    branches: ['**']
    tags: ['blechbestand-v*']
    paths:
      - 'blechbestand/**'
      - '.github/workflows/blechbestand-windows.yml'
  pull_request:
    paths:
      - 'blechbestand/**'
      - '.github/workflows/blechbestand-windows.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Als Release veröffentlichen (Tag blechbestand-v<Version aus Blechbestand.csproj>)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: blechbestand
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests der Datenlogik
        run: dotnet run -c Release --project tests/Blechbestand.Tests.csproj

      - name: Programm bauen
        run: dotnet build -c Release src/Blechbestand.csproj

      - name: Starttest (Fenster öffnet sich, Screenshot)
        run: |
          $exe = (Resolve-Path src/bin/Release/net48/Blechbestand.exe).Path
          $p = Start-Process -FilePath $exe -PassThru
          for ($i = 0; $i -lt 60 -and -not $p.HasExited -and $p.MainWindowHandle -eq 0; $i++) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
          }
          if ($p.HasExited) { throw "Blechbestand.exe hat sich beim Start beendet (Exitcode $($p.ExitCode))." }
          if ($p.MainWindowHandle -eq 0) { throw "Kein Programmfenster nach 30 Sekunden." }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path ../blechbestand-out | Out-Null
          $bmp.Save((Join-Path (Resolve-Path ../blechbestand-out) 'starttest.png'))
          if ($p.HasExited) { throw "Blechbestand.exe ist nach dem Start abgestürzt." }
          Stop-Process -Id $p.Id -Force
          $data = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Blechbestand\bestand.xml'
          if (-not (Test-Path $data)) { throw "Bestandsdatei wurde nicht angelegt: $data" }
          Write-Host "Bestandsdatei angelegt: $data"
          Copy-Item $exe ../blechbestand-out/

      - name: Download-Paket schnüren
        run: |
          $version = ([xml](Get-Content src/Blechbestand.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw "Keine <Version> in src/Blechbestand.csproj" }
          $out = New-Item -ItemType Directory -Force -Path ../blechbestand-paket
          $dir = New-Item -ItemType Directory -Force -Path (Join-Path $out 'Blechbestand')
          Copy-Item src/bin/Release/net48/Blechbestand.exe $dir
          Copy-Item LIESMICH.txt $dir
          Copy-Item assets/logo-512.png (Join-Path $dir 'Logo.png')
          $hash = (Get-FileHash (Join-Path $dir 'Blechbestand.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Compress-Archive -Path $dir -DestinationPath (Join-Path $out "Blechbestand-$version.zip") -Force
          "$hash  Blechbestand.exe" | Set-Content -Encoding ascii (Join-Path $out 'SHA256.txt')
          Remove-Item -Recurse -Force $dir
          Get-ChildItem $out
          Write-Host "Blechbestand $version, SHA-256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Blechbestand
          path: blechbestand-out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Blechbestand-Paket
          path: blechbestand-paket/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/blechbestand-v') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            blechbestand/src/Blechbestand.csproj
            blechbestand/RELEASE.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: Blechbestand-Paket
          path: paket

      - name: Version und Release-Text
        id: version
        shell: bash
        run: |
          csproj=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' blechbestand/src/Blechbestand.csproj | head -1)
          if [[ "$GITHUB_REF" == refs/tags/blechbestand-v* ]]; then version="${GITHUB_REF_NAME#blechbestand-v}"; else version="$csproj"; fi
          if [[ -z "$version" || "$version" != "$csproj" ]]; then
            echo "::error::Version im Tag ($version) passt nicht zur <Version> in Blechbestand.csproj ($csproj)."
            exit 1
          fi
          test -f "paket/Blechbestand-$version.zip"
          {
            cat blechbestand/RELEASE.md
            echo
            echo '**Prüfsumme (SHA-256) der Blechbestand.exe:**'
            echo '```'
            cat paket/SHA256.txt
            echo '```'
          } > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la paket
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: blechbestand-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Blechbestand ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: |
            paket/Blechbestand-${{ steps.version.outputs.version }}.zip
            paket/SHA256.txt
          fail_on_unmatched_files: true
