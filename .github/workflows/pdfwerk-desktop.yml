# PDFwerk als Desktop-Programm bauen (Windows, macOS, Linux), gepackt testen und als Artefakt bereitstellen.
# Tags pdfwerk-v* (z. B. pdfwerk-v1.0.0, passend zur Version in package.json) werden zusätzlich als GitHub-Release veröffentlicht.
# Ohne eigenen Tag: manuell starten mit „Als Release veröffentlichen“; dann legt der Lauf Tag und Release pdfwerk-v<Version> an.
# Ausgeliefert werden die Pakete aus npm run dist:* (ohne Node-Inspector, siehe scripts/release-config.cjs). Weil Playwright
# das Programm über --inspect steuert, läuft der Test auf einem sonst gleichen Testpaket aus release-test/.
name: pdfwerk-desktop

on:
  push:
    branches: ['**']
    tags: ['pdfwerk-v*']
    paths:
      - 'pdfwerk/**'
      - '.github/workflows/pdfwerk-desktop.yml'
  pull_request:
    paths:
      - 'pdfwerk/**'
      - '.github/workflows/pdfwerk-desktop.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Als Release veröffentlichen (Tag pdfwerk-v<Version aus package.json>)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: pdfwerk

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Linux ist keine Zielplattform: ein roter Linux-Lauf hält das Release für Windows und macOS nicht auf
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            artifact: pdfwerk-windows
            script: dist:win
            exe: win-unpacked/PDFwerk.exe
          - label: macOS
            os: macos-latest
            artifact: pdfwerk-macos
            script: dist:mac
            exe: mac-arm64/PDFwerk.app/Contents/MacOS/PDFwerk
          - label: Linux
            os: ubuntu-latest
            artifact: pdfwerk-linux
            script: dist:linux
            exe: linux-unpacked/pdfwerk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pdfwerk/package-lock.json

      - name: Tag und Version abgleichen
        if: startsWith(github.ref, 'refs/tags/pdfwerk-v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "pdfwerk-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $version in package.json"
            exit 1
          fi

      - name: Lock-Datei prüfen (jedes Paket mit Prüfsumme)
        run: node scripts/check-lock.mjs

      - run: npm ci

      - name: Pakete bauen
        id: dist
        run: npm run ${{ matrix.script }}
        env:
          # macOS: ohne Zertifikat nicht im Schlüsselbund suchen; ad-hoc signieren auch bei Pull Requests
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'false' || '' }}
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && 'true' || '' }}

      - name: Ergebnis auflisten
        run: ls -la release

      - name: Signatur und Dateizuordnung prüfen (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in release/mac/PDFwerk.app release/mac-arm64/PDFwerk.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv "$app" 2>&1); echo "$info"
            # Hardened Runtime: DYLD_INSERT_LIBRARIES u. ä. greifen nicht
            echo "$info" | grep -q 'flags=.*runtime' || { echo "::error::$app ohne Hardened Runtime"; exit 1; }
          done
          plutil -p release/mac-arm64/PDFwerk.app/Contents/Info.plist | grep -A20 CFBundleDocumentTypes

      - name: Sandbox und Bildschirm vorbereiten (Linux)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 sperrt unprivilegierte User-Namespaces, die Chromium-Sandbox braucht sie
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Ausgeliefertes Paket prüfen (Fuses, keine Fernsteuerung)
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run check:release -- "release/${{ matrix.exe }}"; else npm run check:release -- "release/${{ matrix.exe }}"; fi

      - name: Testpaket bauen
        id: testpaket
        run: npx electron-builder --dir --publish never -c.directories.output=release-test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && 'false' || '' }}
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' && 'true' || '' }}

      - name: Gepacktes Programm testen
        id: test
        timeout-minutes: 15
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop; else npm run test:desktop; fi
        env:
          PDFWERK_EXE: ${{ github.workspace }}/pdfwerk/release-test/${{ matrix.exe }}

      # Messung zum gemeldeten Einfrieren beim Wechsel zwischen Lesen, Bearbeiten, Seiten und Werkzeuge auf echten macOS- und
      # Windows-Rechnern: Tabellen und eine Zeile DIAG-JSON im Protokoll. Hält den Lauf nicht auf, auch nicht bei Exit-Code 1 (Wechsel über 5 s).
      - name: Diagnose Moduswechsel
        if: ${{ !cancelled() && steps.testpaket.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/diag-modes.mjs; else node scripts/diag-modes.mjs; fi
        env:
          PDFWERK_EXE: ${{ github.workspace }}/pdfwerk/release-test/${{ matrix.exe }}

      # auch bei rotem Test hochladen, damit sich der Fehler am Paket nachvollziehen lässt; dann als fehlerhaft-…, das Release nimmt nur pdfwerk-*
      - name: Artefakte hochladen
        if: ${{ !cancelled() && steps.dist.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.test.outcome == 'success' && matrix.artifact || format('fehlerhaft-{0}', matrix.artifact) }}
          path: |
            pdfwerk/release/*.exe
            pdfwerk/release/*.zip
            pdfwerk/release/*.dmg
            pdfwerk/release/*.AppImage
            !pdfwerk/release/*__uninstaller*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/pdfwerk-v') || (github.event_name == 'workflow_dispatch' && inputs.release)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pdfwerk-*
          path: pakete
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: quelle
          sparse-checkout: pdfwerk/package.json
          sparse-checkout-cone-mode: false

      - name: Version bestimmen
        id: version
        working-directory: .
        run: |
          if [[ "$GITHUB_REF" == refs/tags/pdfwerk-v* ]]; then version="${GITHUB_REF_NAME#pdfwerk-v}"
          else version=$(node -p "require('./quelle/pdfwerk/package.json').version"); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la pakete

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: pdfwerk-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PDFwerk ${{ steps.version.outputs.version }}
          files: pakete/*
          fail_on_unmatched_files: true
          generate_release_notes: true
